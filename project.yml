name: Sift
options:
  bundleIdPrefix: app.sift
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
packages:
  # The house settings shell, changelog view and standard panes
  # (michellzappa/housekit). Pinned to a commit so CI, the mini and the
  # laptop build the same code; move the pin on purpose.
  HouseKit:
    url: https://github.com/michellzappa/housekit
    revision: e894441e4194c8d65dde24119976b83e4453f313
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # The release workflow and scripts/build-app.sh set this to the git
    # commit count.
    CURRENT_PROJECT_VERSION: "1"
    # Real identity, not ad-hoc: TCC keys the Full Disk Access grant to the
    # code signature, so an ad-hoc build loses the grant on every rebuild.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Development
    DEVELOPMENT_TEAM: 992N457T8D
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
targets:
  Sift:
    type: application
    platform: macOS
    sources:
      - path: Sift
        excludes:
          - "Resources/Info.plist"
          - "Resources/Sift.entitlements"
      # The Chrome extension, copied whole into Resources. Sift copies it
      # to Application Support for Load unpacked (ChromeHelper).
      - path: ChromeExtension
        type: folder
        buildPhase: resources
      # Sample data for demo mode (Sift/Demo/Demo.swift), copied whole into
      # Resources/Demo and from there into Application Support/Sift-Demo.
      - path: Demo
        type: folder
        buildPhase: resources
      # The updater (Sift/App/Updates.swift runs it from Contents/Resources).
      - path: scripts/update-app.sh
        buildPhase: resources
      # Version history (ChangelogView); also the GitHub release notes.
      - path: CHANGELOG.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sift.Sift
        PRODUCT_NAME: Sift
        CODE_SIGN_ENTITLEMENTS: Sift/Resources/Sift.entitlements
        INFOPLIST_FILE: Sift/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        # Apple's on-device model needs macOS 26; Sift runs on macOS 14.
        # Weak-linked so the app launches where the framework does not exist.
        OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels"
    dependencies:
      - package: HouseKit
      # The MCP server ships inside the app at Contents/MacOS/sift-mcp,
      # signed on copy with the app's identity.
      - target: sift-mcp
        embed: true
        codeSign: true
        copy:
          destination: executables
      # Chrome's native messaging host, at Contents/MacOS/sift-chrome.
      - target: sift-chrome
        embed: true
        codeSign: true
        copy:
          destination: executables
  sift-mcp:
    type: tool
    platform: macOS
    sources:
      - path: SiftMCP
    settings:
      base:
        PRODUCT_NAME: sift-mcp
        PRODUCT_BUNDLE_IDENTIFIER: app.sift.sift-mcp
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  sift-chrome:
    type: tool
    platform: macOS
    sources:
      - path: SiftChrome
    settings:
      base:
        PRODUCT_NAME: sift-chrome
        PRODUCT_BUNDLE_IDENTIFIER: app.sift.sift-chrome
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
schemes:
  Sift:
    build:
      targets:
        Sift: all
    run:
      config: Debug
    archive:
      config: Release
