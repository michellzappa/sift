name: Release

# Push a tag that matches CFBundleShortVersionString (for example v0.2.0).
# The workflow builds a universal app, signs it with Developer ID, notarizes
# and staples it, publishes a ZIP and SHA256SUMS to the GitHub Release, and
# attests the build provenance so anyone can verify where the ZIP came from:
#   gh attestation verify Sift-0.2.0.zip -R michellzappa/sift

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-15

    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_DEVELOPER_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
      APPLE_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}

    steps:
      - name: Check out source (full history for the build number)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate tag, set version and build number
        shell: bash
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Sift/Resources/Info.plist)
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$version" != "$tag_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $version"
            exit 1
          fi
          build=$(git rev-list --count HEAD)
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "APP_BUILD=$build" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        shell: bash
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/sift-build.keychain-db"
          keychain_password=$(openssl rand -hex 20)
          echo "$APPLE_DEVELOPER_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_DEVELOPER_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security default-keychain -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"

      - name: Archive universal app
        shell: bash
        run: |
          xcodebuild \
            -project Sift.xcodeproj \
            -scheme Sift \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -archivePath "$RUNNER_TEMP/Sift.xcarchive" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CURRENT_PROJECT_VERSION="$APP_BUILD" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive

      - name: Verify app signature and build number
        shell: bash
        run: |
          app_path="$RUNNER_TEMP/Sift.xcarchive/Products/Applications/Sift.app"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Contents/Info.plist"

      - name: Notarize
        shell: bash
        run: |
          app_path="$RUNNER_TEMP/Sift.xcarchive/Products/Applications/Sift.app"
          zip="$RUNNER_TEMP/Sift-notarization.zip"
          key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$zip"
          echo "$APPLE_API_PRIVATE_KEY_BASE64" | base64 --decode > "$key"
          xcrun notarytool submit "$zip" --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait

      - name: Staple notarization ticket
        shell: bash
        run: |
          app_path="$RUNNER_TEMP/Sift.xcarchive/Products/Applications/Sift.app"
          xcrun stapler staple "$app_path"
          xcrun stapler validate "$app_path"

      - name: Package release assets
        shell: bash
        run: |
          app_path="$RUNNER_TEMP/Sift.xcarchive/Products/Applications/Sift.app"
          mkdir -p "$RUNNER_TEMP/release"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$RUNNER_TEMP/release/Sift-$APP_VERSION.zip"
          (cd "$RUNNER_TEMP/release" && shasum -a 256 "Sift-$APP_VERSION.zip" > SHA256SUMS)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/release/Sift-${{ env.APP_VERSION }}.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/release/Sift-$APP_VERSION.zip" \
            "$RUNNER_TEMP/release/SHA256SUMS" \
            --title "Sift $APP_VERSION (build $APP_BUILD)" \
            --generate-notes
