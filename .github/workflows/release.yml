name: Release

# The shared Mac release (michellzappa/housekit, docs/releasing.md): build,
# Developer ID, notarize, GitHub Release, Sparkle appcast.
#
#   gh workflow run release.yml -R michellzappa/sift -f publish=true
#
# tags main as v<version> and publishes. Pushing a v* tag does the same.
# Without publish it builds and checks only. Verify a download:
#   gh attestation verify Sift-<version>.zip -R michellzappa/sift

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Tag v<version> and publish the release
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: michellzappa/housekit/.github/workflows/release-mac.yml@main
    with:
      app-name: Sift
      # The embedded MCP server and Chrome host need Developer ID, hardened
      # runtime and a timestamp, or notarization rejects the app.
      verify-command: |
        for helper in sift-mcp sift-chrome; do
          codesign -dvv "$APP_PATH/Contents/MacOS/$helper" 2>&1 | tee "$RUNNER_TEMP/$helper-sign.txt"
          grep -q "Authority=Developer ID Application" "$RUNNER_TEMP/$helper-sign.txt"
          grep -q "flags=.*runtime" "$RUNNER_TEMP/$helper-sign.txt"
          grep -q "^Timestamp=" "$RUNNER_TEMP/$helper-sign.txt"
        done
        test -f "$APP_PATH/Contents/Resources/CHANGELOG.md"
      publish: ${{ github.event_name == 'push' || inputs.publish }}
    secrets:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_DEVELOPER_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
      APPLE_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
      SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
