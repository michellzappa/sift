# Sift for iPhone (TestFlight, bundle com.centaur-labs.sift; began as the deck prototype, see README.md).
# XcodeGen: `xcodegen generate` makes SiftDeck.xcodeproj (gitignored).
name: SiftDeck
options:
  bundleIdPrefix: app.sift
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 992N457T8D
    CODE_SIGN_STYLE: Automatic
targets:
  SiftDeck:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../../Sift/Views/ScrollPast.swift
      # The reader's look (column, sizes, Markdown blocks), shared with the Mac.
      - path: ../../Sift/Views/ReaderStyle.swift
      # Closeness in meaning (Apple's on-device embeddings), shared with the Mac.
      - path: ../../Sift/Engine/Meaning.swift
      # What Sift knows about you (Settings > You), built on the Mac.
      - path: ../../Sift/Engine/Profile.swift
      # The networks and their dials (Today's network factor), shared with the Mac.
      - path: ../../Sift/Engine/NetworkDial.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.centaur-labs.sift
        PRODUCT_NAME: Sift
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Sift
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
