# Throwaway iOS prototype for the Sift deck and deep stream (see README.md).
# XcodeGen: `xcodegen generate` makes SiftDeck.xcodeproj (gitignored).
name: SiftDeck
options:
  bundleIdPrefix: app.sift
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 992N457T8D
    CODE_SIGN_STYLE: Automatic
targets:
  SiftDeck:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sift.deck-prototype
        PRODUCT_NAME: Sift Deck
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Sift Deck
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
